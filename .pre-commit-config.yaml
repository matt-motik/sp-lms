repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - django>=6.1
          - django-environ
          - djangorestframework
        args: [ --config-file=pyproject.toml ]
        exclude: ^.*/migrations/.*$
        files: ^(lms|config|users)/