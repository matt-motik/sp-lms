[project]
name = "sp-lms"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
lint = [
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
line-length = 119
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
]
ignore = [
    "E203",  # whitespace before ':'
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["D", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["^.venv/", "^venv/", "__pycache__", "tests/", "^.*/migrations/.*$"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true
